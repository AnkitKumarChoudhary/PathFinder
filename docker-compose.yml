version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_counsel_db
      POSTGRES_USER: cc_admin
      POSTGRES_PASSWORD: cc_secret_2025
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: